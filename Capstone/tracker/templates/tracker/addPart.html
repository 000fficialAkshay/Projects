{% extends "tracker/layout.html" %}

{% block body %}

<h1>Add Part</h1>

<p>Course: {{ course.name }}</p>

<form action="{% url 'addPart' course.id %}" method="post">
    {% csrf_token %}

    <label for="name">Part Name:</label>
    <input type="text" id="name" name="name" required>

    <input type="submit" value="Add Part">
</form>

{% endblock %}
