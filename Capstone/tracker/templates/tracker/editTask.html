{% extends "tracker/layout.html" %}

{% block body %}

<h1>Edit Task</h1>

<form action="{% url 'editTask' task.id %}" method="post">
    {% csrf_token %}

    <label for="name">Task Name:</label>
    <input type="text" id="name" name="name" value="{{ task.name }}" required>

    <br><br>

    <label for="resource_url">Resource URL (optional):</label>
    <input type="url" id="resource_url" name="resource_url" value="{{ task.resource_url }}">

    <br><br>

    <input type="submit" value="Save Changes">
</form>

{% endblock %}
