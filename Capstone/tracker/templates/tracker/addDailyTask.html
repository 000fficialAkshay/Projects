{% extends "tracker/layout.html" %}

{% block body %}

<h1>Add Daily Task</h1>

<p>Task: {{ task.name }}</p>
<p>Date: Today</p>

<form action="{% url 'addDailyTask' task.id %}" method="post">
    {% csrf_token %}

    <label for="planned_minutes">Planned Time (minutes):</label>
    <input type="number" id="planned_minutes" name="planned_minutes" min="1" required>

    <br><br>

    <input type="submit" value="Add to Today's Tasks">
</form>

{% endblock %}
