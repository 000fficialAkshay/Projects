{% extends "tracker/layout.html" %}

{% block body %}

<h1>Edit Part</h1>

<form action="{% url 'editPart' part.id %}" method="post">
    {% csrf_token %}

    <label for="name">Part Name:</label>
    <input type="text" id="name" name="name" value="{{ part.name }}" required>

    <br><br>

    <input type="submit" value="Save Changes">
</form>

{% endblock %}
