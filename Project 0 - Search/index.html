<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: #202124;
        }

        .nav {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav a {
            color: #202124;
            text-decoration: none;
            font-size: 14px;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 100px;
        }

        h1 {
            font-size: 80px;
            font-weight: normal;
            margin: 0 0 30px;
            color: #4285F4;
            letter-spacing: -4px;
        }

        form {
            width: 100%;
            max-width: 584px;
        }

        .search-box {
            width: 100%;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
        }

        .search-box:hover,
        .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: transparent;
        }

        input[type="text"] {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 10px;
        }

        .search-icon {
            color: #9aa0a6;
            font-size: 18px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        input[type="submit"] {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 18px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="nav">
        <a href="image.html">Image Search</a>
        <a href="advanced.html">Advanced Search</a>
    </div>

    <div class="main">
        <h1>Google</h1>

        <form action="https://www.google.com/search" method="get">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" name="q" autocomplete="off">
            </div>

            <div class="buttons">
                <input type="submit" value="Google Search">
                <input type="submit" name="btnI" value="I'm Feeling Lucky">
            </div>
        </form>
    </div>

</body>
</html>
